<div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title" id="confirmDeleteModalLabel">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>Confirmar Eliminación de Contrato
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4 text-center">
                <p class="fs-5 mb-1">¿Estás seguro de que deseas eliminar el contrato de:</p>
                <h4 class="text-danger fw-bold mb-4">{{ contract.nombre_arrendatario }}</h4>
                <p class="text-muted small">Esta acción eliminará permanentemente el registro del contrato del sistema.</p>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <form method="post" action="{% url 'contratos:delete_contract' id=contract.id %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">Eliminar Contrato</button>
                </form>
            </div>
        </div>
    </div>
</div>
