{% extends 'base.html' %}

{% block title %}Borrar Contrato - Recibos App{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0 p-5">
            <div class="mb-4">
                <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 5rem;"></i>
            </div>
            <h2 class="fw-bold mb-3 text-danger">Eliminar Contrato</h2>
            <p class="fs-5 mb-1">¿Estás seguro de que deseas eliminar el contrato de:</p>
            <h4 class="fw-bold mb-4">{{ contract.nombre_arrendatario }}</h4>
            <div class="d-grid gap-2">
                <form method="post" action="{% url 'contratos:delete_contract' id=contract.id %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-lg w-100">Eliminar Contrato</button>
                </form>
                <a href="{% url 'contratos:all_contracts' %}" class="btn btn-link text-muted">
                    Cancelar y volver
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
