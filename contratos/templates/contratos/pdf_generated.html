{% extends 'base.html' %}

{% block title %}Contrato Generado - Recibos App{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0 p-5">
            <div class="mb-4">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
            </div>
            <h2 class="fw-bold mb-3">¡Contrato Listo!</h2>
            <p class="text-muted mb-4 fs-5">El contrato ha sido generado y enviado a su correo electrónico.</p>
            <div class="d-grid gap-2">
                <a href="{% url 'recibos:generate_pdfs' %}" class="btn btn-success btn-lg">
                    OK
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
