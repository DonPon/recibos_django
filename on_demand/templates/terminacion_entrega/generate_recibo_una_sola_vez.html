{% extends "base.html" %}

{% block title %}Recibo Único - Recibos App{% endblock %}

{% block header %}
    <h1 class="display-5 fw-bold mb-0">Recibo Único</h1>
    <p class="lead opacity-75">Generar un recibo ocasional rápidamente</p>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8 col-xl-7">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <form method="post" action="{% url 'on_demand:generate_recibo_on_demand' %}">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-3 mb-4">
                            <label for="titulo" class="form-label fw-bold small text-uppercase text-muted">Título</label>
                            <select id="titulo" name="titulo" class="form-select form-select-lg" required>
                                <option value="SR.">SR.</option>
                                <option value="SRA.">SRA.</option>
                            </select>
                        </div>
                        <div class="col-md-9 mb-4">
                            <label for="name" class="form-label fw-bold small text-uppercase text-muted">Nombre del inquilino</label>
                            <input type="text" id="name" name="name" class="form-control form-control-lg" placeholder="Nombre completo" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label for="precio" class="form-label fw-bold small text-uppercase text-muted">Monto</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text">$</span>
                                <input type="text" id="precio" name="precio" class="form-control" placeholder="6,500.00" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label for="tipo_recibo" class="form-label fw-bold small text-uppercase text-muted">Tipo de Recibo</label>
                            <select id="tipo_recibo" name="tipo_recibo" class="form-select form-select-lg" required>
                                <option value="deposito">DEPÓSITO</option>
                                <option value="anticipo">ANTICIPO</option>
                                <option value="apartado">APARTADO</option>
                                <option value="renta">RENTA</option>
                                <option value="devolucion de deposito">DEVOLUCIÓN DE DEPÓSITO</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="propiedad" class="form-label fw-bold small text-uppercase text-muted">Propiedad</label>
                        <select id="propiedad" name="propiedad" class="form-select form-select-lg" required>
                            <option value="Noche de Paz #14, Colonia Granjas Navidad, Delegación Cuajimalpa, C.P. 05219">
                                Noche de Paz #14, Colonia Granjas Navidad, Cuajimalpa
                            </option>
                            <option value="2do. Retorno de Loma del Recuerdo # 70, Colonia Lomas de Vista Hermosa, Delegación Cuajimalpa, C.P. 05100">
                                Loma del Recuerdo #70, Lomas de Vista Hermosa
                            </option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="local" class="form-label fw-bold small text-uppercase text-muted">Local/depto.</label>
                        <input type="text" id="local" name="local" class="form-control form-control-lg" placeholder="Ej. 5D, C, etc." required>
                    </div>

                    <div class="d-grid gap-2 mt-5">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-file-earmark-pdf-fill me-2"></i>Generar Recibo...
                        </button>
                        <a href="{% url 'recibos:generate_pdfs' %}" class="btn btn-link text-muted">
                            Volver al inicio
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
