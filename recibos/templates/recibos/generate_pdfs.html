<!-- generate_pdfs.html -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Recibos</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #edeef0;; /* Light grayish-blue background */
        }
        .container {
            margin-top: 50px;
        }
        .nav-link-inquilinos {
            font-size: 20px;
            padding: 15px 20px;
        }
        .card {
            width: 100%;
            margin: auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border: none;
            border-radius: 8px;
        }
        .line {
            width: 100%;
            height: 0.5px;
            background-color: #ced4da;
            margin: 0;
            padding: 0;
        }
        .card-body {
            text-align: center;
            padding: 20px;
        }
        .card-title {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-size: 16px;
            margin-bottom: 5px;
            display: block;
            text-align: left;
        }
        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }
        .btn-primary {
            font-size: 18px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="line"></div>
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link nav-link-inquilinos" href="{% url 'update_tenants' %}">Inquilinos</a>
            </li>
        </ul>
        <div class="card">
            <div class="card-body">
                <h1 class="card-title">Generador de Recibos</h1>
                <form method="post" action="{% url 'generate_pdfs' %}">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="monthSelect">Selecciona el mes:</label>
                        <select class="form-control" id="monthSelect" name="month">
                            <option value="enero">Enero</option>
                            <option value="febrero">Febrero</option>
                            <option value="marzo">Marzo</option>
                            <option value="abril">Abril</option>
                            <option value="mayo">Mayo</option>
                            <option value="junio">Junio</option>
                            <option value="julio">Julio</option>
                            <option value="agosto">Agosto</option>
                            <option value="septiembre">Septiembre</option>
                            <option value="octubre">Octubre</option>
                            <option value="noviembre">Noviembre</option>
                            <option value="diciembre">Diciembre</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Generar Recibos</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
