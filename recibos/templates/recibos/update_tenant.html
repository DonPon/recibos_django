<!-- update_tenant.html -->
<html>
<head>
    <title>Update Tenant</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h1 class="card-title">Update Tenant: {{ editing_tenant.name }}</h1>
            </div>
            <div class="card-body">
                <form method="post" action="{% url 'update_tenant' tenant_name=editing_tenant.name %}">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="{{ form.name.id_for_label }}">Name:</label>
                        {{ form.name }}
                    </div>
                    <div class="form-group">
                        <label for="{{ form.dia.id_for_label }}">Dia:</label>
                        {{ form.dia }}
                    </div>
                    <div class="form-group">
                        <label for="{{ form.precio.id_for_label }}">Precio:</label>
                        {{ form.precio }}
                    </div>
                    <div class="form-group">
                        <label for="{{ form.precio_en_letra.id_for_label }}">Precio en Letra:</label>
                        {{ form.precio_en_letra }}
                    </div>
                    <div class="form-group">
                        <label for="{{ form.servicios.id_for_label }}">Servicios:</label>
                        {{ form.servicios }}
                    </div>
                    <div class="form-group">
                        <label for="{{ form.local.id_for_label }}">Local:</label>
                        {{ form.local }}
                    </div>
                    <button type="submit" class="btn btn-primary">Update Tenant</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
