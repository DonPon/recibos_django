<!DOCTYPE html>
<html lang="en">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Recibos{% endblock %}</title>


    <style>
        body {
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
    background: linear-gradient(to right, #7d5ea6, #a18dd6);
    color: white;
    text-align: center;
    padding: 1rem;
}

        main {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            width: 100%;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            border: 1px solid #9ea3a5; /* Subtle border color */
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header><br>{% block header %}{% endblock %}<br>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center fixed-bottom bg-light py-3">
        <p>&copy; 2024 Franz Eckermann</p>
    </footer>



</body>
</html>
