<!-- add_tenant.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Inquilino</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Add Bootstrap CDN links here if not included in your project -->
    <!-- For example: -->
    <!-- <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"> -->
    <style>
        body {
            background-color: #edeef0; /* Light grayish-blue background */
        }
        .container {
            margin-top: 50px;
        }
        .card {
            width: 100%;
            margin: auto;
        }
        .card-header {
            background-color: #3498db; /* Blue header color */
            color: #fff;
            font-size: 18px;
        }
        .card-body {
            background-color: #fff; /* White card body */
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            font-size: 16px;
        }
        input {
            width: 100%;
            font-size: 16px;
        }
        .btn-primary {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Nuevo Inquilino</h2>
            </div>
            <div class="card-body">
                <form method="post" action="{% url 'add_tenant' %}">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary btn-block">Guardar</button>
                </form>
                <a href="{% url 'update_tenants' %}" class="btn btn-secondary btn-block mt-2">Atras</a>
            </div>
        </div>
    </div>
</body>
</html>
