<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Inquilino</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Add Bootstrap CDN links here if not included in your project -->
    <!-- For example: -->
    <!-- <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"> -->
    <style>
                        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            width: 70%;
            margin: auto;
        }
        .form {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        label {
            width: 30%; /* Adjust the width based on your preference */
            font-size: 16px;
        }
        input {
            width: 80%; /* Adjust the width based on your preference */
            font-size: 16px;
        }
        .btn-primary {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Nuevo Inquilino</h2>
        <form method="post" action="{% url 'add_tenant' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
        <a href="{% url 'update_tenants' %}" class="btn btn-secondary mt-2">Atras</a>
    </div>
</body>
</html>
