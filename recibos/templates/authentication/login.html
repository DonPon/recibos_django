{% extends 'base.html' %}
{% block content %}
<style>
            .form-group {
            margin-bottom: 15px;
        }
        label {
            font-size: 16px;
        }
        input {
            width: 100%;
            font-size: 16px;
        }
        .btn-primary {
            font-size: 16px;
        }
</style>

<div class="container">
        <div class="card shadow-lg">
            <div class="card-header">
                <h3 class="card-title">Login</h3>
            </div>
            <div class="card-body">
    <form method="post">
        <div class="form-group">
            <label>Usuario:</label>
            {{ form.username }}
        </div>
        <div class="form-group">
            <label>Contraseña:</label>
            {{ form.password }}
        </div>
        {% csrf_token %}
        <button type="submit" class="btn btn-success btn-block">Entrar</button>
    </form>
</div></div>
<h2 class="card-title">{{ message }}</h2>
    </div>
{% endblock content %}
