<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrar Contrato</title>
    <!-- Add Bootstrap CDN links here if not included in your project -->
    <!-- For example: -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h2 {
            color: #dc3545;
        }
        p {
            margin-bottom: 20px;
        }
        button {
            margin-top: 10px;
        }
        .btn-secondary {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Eliminar Contrato</h2>
        <p>Estas seguro que deseas eliminar contrato <strong>{{ contract.nombre_arrendatario }}</strong>?</p>
        <form method="post" action="{% url 'delete_contract' id=contract.id %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Eliminar</button>
        </form>
        <a href="{% url 'generate_pdfs' %}" class="btn btn-secondary">Cancelar</a>
    </div>
</body>
</html>
