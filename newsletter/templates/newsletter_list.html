{% extends 'base.html' %}

{% block title %}Newsletter List{% endblock %}

{% block header %}
<h1>Newsletter Management</h1>
{% endblock %}

{% block content %}
<div class="container">
    <h2 class="text-center my-4">Newsletters</h2>
    <ul class="list-group">
        {% for newsletter in newsletters %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <strong>{{ newsletter.title }}</strong>
            <a href="{% url 'newsletter:send_newsletter' newsletter.id %}" class="btn btn-primary btn-sm send-link">Send</a>
        </li>
        {% endfor %}
    </ul>
    <div class="mt-4 text-center">
        <a href="{% url 'newsletter:send_all_newsletters' %}" class="btn btn-success send-link">Send All Newsletters</a>
    </div>
</div>

<script>
    document.querySelectorAll('.send-link').forEach(link => {
        link.addEventListener('click', function(event) {
            event.preventDefault();
            const url = this.href;
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        alert(data.message);
                    } else {
                        alert('Error: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An unexpected error occurred.');
                });
        });
    });
</script>
{% endblock %}
