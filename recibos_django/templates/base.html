<!DOCTYPE html>
<html lang="en">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Recibos{% endblock %}</title>


    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Ensure the body takes up the full height of the viewport */
            margin: 0;
        }
        header {
            background: linear-gradient(to right, #815ee0 , #d6659e);
            color: white;
            text-align: center;
            padding: 1rem;
        }
    
        main {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 1rem;
            margin-bottom: 60px; /* Adjusted margin to prevent footer from overlapping content */
        }
    
        .card {
            width: 100%;
            margin-bottom: 20px;
            box-shadow: 0 14px 18px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            border: 1px solid #9ea3a5; /* Subtle border color */
            border-radius: 8px;
        }
    
        .btn-primary {
            background: linear-gradient(to right, #6f25e6, #2962ff);
            border-color: #a18dd6;  
            color: white;
        }
    
        footer {
            background-color: #f8f9fa; /* Light gray background for the footer */
            padding: 1rem;
            text-align: center;
            border-top: 1px solid #dee2e6; /* Subtle border at the top of the footer */
        }
    </style>
</head>
<body>
    <header><br>{% block header %}{% endblock %}<br>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center fixed-bottom bg-light py-3">
        <p><small>{{ ENV }}</small> - {{ current_year }} Franz Eckermann &copy; </p>
    </footer>



</body>
</html>
